<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cadastro de Responsável</title>
</head>
<body>
    <h1>Cadastro de Responsável</h1>

    <form th:action="@{/responsavel/inserir}"
          th:object="${responsavel}"
          method="post">

        <label>Nome:</label>
        <input type="text" th:field="*{nome}" required>
        <br>

        <label>CPF:</label>
        <input type="text" th:field="*{cpf}" required>
        <br>

        <label>Telefone:</label>
        <input type="text" th:field="*{telefone}" required>
        <br>

        <label>Email:</label>
        <input type="email" th:field="*{email}" required>
        <br>

        <button type="submit">Cadastrar</button>

    </form>
    <a th:href="@{/responsavel}">Voltar para a lista</a>
</body>
</html>
