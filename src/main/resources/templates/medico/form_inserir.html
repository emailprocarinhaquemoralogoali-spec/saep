<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cadastro de Medico</title>
</head>
<body>
    <h1>Cadastro de Medico</h1>

    <form th:action="@{/medico/inserir}"
          th:object="${medico}"
          method="post">

        <label>Nome:</label>
        <input type="text" th:field="*{nome}" required>
        <br>

        <label>CRM:</label>
        <input type="text" th:field="*{crm}" required>
        <br>

        <label>Especialidade:</label>
        <input type="text" th:field="*{especialidade}" required>
        <br>
        <button type="submit">Cadastrar</button>

    </form>
    <a th:href="@{/medico}">Voltar para a lista</a>
</body>
</html>
