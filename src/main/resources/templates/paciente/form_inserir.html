<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cadastro de Paciente</title>
</head>
<body>
    <h1>Cadastro de Paciente</h1>

    <form th:action="@{/paciente/inserir}"
          th:object="${paciente}"
          method="post">

        <label>Nome:</label>
        <input type="text" th:field="*{nome}" required>
        <br>

        <label>Responsável:</label>
        <select name="responsavelId" required>
            <option value="">Selecione</option>
            <option th:each="responsavel : ${responsaveis}"
                    th:value="${responsavel.id}"
                    th:text="${responsavel.nome}"></option>
        </select>
        <br>

        <label>Data de Nascimento:</label>
        <input type="date" th:field="*{dataNascimento}" required>
        <br>


        <br>

        <button type="submit">Cadastrar</button>

    </form>
    <a th:href="@{/paciente}">Voltar para a lista</a>
</body>
</html>
